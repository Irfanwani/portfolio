<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03040a"/><stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>

  <!-- isometric wireframe cube: the cursor motif -->
  <g fill="none" stroke="url(#edge)" stroke-width="2" stroke-linejoin="round">
    <path d="M32 12 L50 22 L50 42 L32 52 L14 42 L14 22 Z"/>
    <path d="M32 12 L32 32 L14 22 M32 32 L50 22"/>
  </g>

  <!-- nodes at the cube vertices -->
  <g fill="#22d3ee">
    <circle cx="32" cy="12" r="3"/><circle cx="14" cy="22" r="2.4"/>
    <circle cx="50" cy="22" r="2.4"/>
  </g>
  <g fill="#a78bfa">
    <circle cx="32" cy="32" r="2.6"/><circle cx="14" cy="42" r="2.2"/>
    <circle cx="50" cy="42" r="2.2"/><circle cx="32" cy="52" r="2.2"/>
  </g>
</svg>
